<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 790" width="1100" height="790" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .scr{fill:#fff;stroke:#1a1a1a;stroke-width:4;stroke-linejoin:round}
  .nav{fill:#e6e6e6;stroke:#1a1a1a;stroke-width:3}
  .card{fill:#fff;stroke:#1a1a1a;stroke-width:2.5}
  .bar{fill:#c9c9c9}
  .btn{fill:#fff;stroke:#1a1a1a;stroke-width:3}
  .fld{fill:#fff;stroke:#1a1a1a;stroke-width:2.5}
  .warn{fill:#fff;stroke:#1a1a1a;stroke-width:2.5;stroke-dasharray:6 5}
  text{font-family:'Comic Sans MS','Chalkboard SE','Segoe Print',cursive,sans-serif;fill:#1a1a1a}
  .cap{font-size:17px;font-weight:bold}
  .s{font-size:12px}
  .b{font-size:12px;font-weight:bold}
</style>
<rect x="0" y="0" width="1100" height="790" fill="#fff"/>

<!-- ===== 1 Startseite / Login ===== -->
<text class="cap" x="30" y="30">1  Startseite / Login</text>
<rect class="scr" x="30" y="42" width="320" height="300" rx="5"/>
<rect class="nav" x="30" y="42" width="320" height="34"/>
