<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1010" width="800" height="1010" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .box{fill:#fff;stroke:#1a1a1a;stroke-width:4;stroke-linejoin:round}
  .ln{stroke:#1a1a1a;stroke-width:3;stroke-linecap:round}
  .thin{stroke:#1a1a1a;stroke-width:2;stroke-linecap:round}
  text{font-family:'Comic Sans MS','Chalkboard SE','Segoe Print',cursive,sans-serif;fill:#1a1a1a}
  .t{font-size:19px;font-weight:bold}
  .a{font-size:15px}
  .lbl{font-size:16px;font-weight:bold}
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
  </marker>
</defs>
<rect x="0" y="0" width="800" height="1010" fill="#fff"/>

<!-- 1 Login -->
<rect class="box" x="230" y="30" width="330" height="130" rx="6"/>
<text class="t" x="245" y="58">STARTSEITE / LOGIN</text>
<line class="thin" x1="245" y1="68" x2="545" y2="68"/>
<text class="a" x="250" y="92">Feld: E-Mail</text>
<text class="a" x="250" y="114">Feld: Passwort</text>
<text class="a" x="250" y="145">[ Anmelden ]</text>
<line class="ln" x1="395" y1="160" x2="395" y2="200" marker-end="url(#ar)"/>

<!-- 2 Uebersicht -->
<rect class="box" x="205" y="205" width="380" height="155" rx="6"/>
<text class="t" x="220" y="233">PORTALUEBERSICHT</text>
<line class="thin" x1="220" y1="243" x2="570" y2="243"/>
<text class="a" x="225" y="267">Liste: Name / Dimension / Zeit</text>
<text class="a" x="225" y="289">"X von Y Plaetzen frei"</text>
<text class="a" x="225" y="311">Link: Meine Reservierungen</text>
<text class="a" x="225" y="345">[ Details ]  -&gt; Portal auswaehlen</text>
<line class="ln" x1="395" y1="360" x2="395" y2="400" marker-end="url(#ar)"/>

<!-- 3 Detail -->
<rect class="box" x="205" y="405" width="380" height="155" rx="6"/>
<text class="t" x="220" y="433">PORTAL-DETAIL</text>
<line class="thin" x1="220" y1="443" x2="570" y2="443"/>
<text class="a" x="225" y="467">Name, Dimension, Abflugzeit</text>
<text class="a" x="225" y="489">Kapazitaet / reserviert / frei</text>
<text class="a" x="225" y="511">Link: Zurueck</text>
<text class="a" x="225" y="545">[ Platz reservieren ]</text>
<line class="ln" x1="395" y1="560" x2="395" y2="600" marker-end="url(#ar)"/>

<!-- 4 Pruefung -->
<rect class="box" x="235" y="605" width="320" height="105" rx="6" fill="#f2f2f2"/>
<text class="t" x="250" y="633">PRUEFUNG (Server)</text>
<text class="a" x="250" y="660">Transaktion + Sperre auf Portal</text>
<text class="a" x="250" y="686">freie Plaetze &gt; 0 ?</text>

<!-- split -->
<line class="ln" x1="300" y1="710" x2="180" y2="790" marker-end="url(#ar)"/>
<text class="lbl" x="195" y="748">JA</text>
<line class="ln" x1="490" y1="710" x2="610" y2="790" marker-end="url(#ar)"/>
<text class="lbl" x="560" y="748">NEIN</text>

<!-- 5 Erfolg -->
<rect class="box" x="25" y="795" width="330" height="175" rx="6"/>
<text class="t" x="40" y="823">MEINE RESERVIERUNGEN</text>
<line class="thin" x1="40" y1="833" x2="340" y2="833"/>
<text class="a" x="45" y="860">OK: "Platz reserviert"</text>
<text class="a" x="45" y="885">Liste: eigene Buchungen</text>
<text class="a" x="45" y="910">[ Stornieren ]</text>
<text class="a" x="45" y="940">Link: Zurueck zur Uebersicht</text>
<text class="a" x="45" y="962">freie Plaetze sinken fuer alle</text>

<!-- 6 Fehler -->
<rect class="box" x="435" y="795" width="340" height="175" rx="6"/>
<text class="t" x="450" y="823">PORTAL-DETAIL (neu)</text>
<line class="thin" x1="450" y1="833" x2="760" y2="833"/>
<text class="a" x="455" y="860">!  "Portal ist inzwischen voll"</text>
<text class="a" x="455" y="885">Anzeige: 0 Plaetze frei</text>
<text class="a" x="455" y="910">[ Reservieren ]  inaktiv</text>
<text class="a" x="455" y="940">Link: Zurueck zur Uebersicht</text>
<text class="a" x="455" y="962">keine Buchung gespeichert</text>
</svg>
