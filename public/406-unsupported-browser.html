<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark">
    <title>Browser zu alt - PortalHub</title>
    <link rel="icon" href="/icon.png" type="image/png">
    <style>
      /* Standalone on purpose: these pages must work even when the app is down. */
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background: radial-gradient(60rem 36rem at 85% -12%, rgb(139 227 106 / 0.10), transparent 60%), #0a0e0c;
        color: #e9f0ea;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 34rem; text-align: center; }
      .rick { display: block; width: auto; height: 13rem; margin: 0 auto 2rem; }
      h1 { margin: 0; font-size: clamp(2rem, 6vw, 2.75rem); line-height: 1.1; letter-spacing: -0.03em; }
      p { margin: 1rem 0 0; color: #9aaba0; font-size: 1.1rem; }
      .code { margin-top: 2rem; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.9rem; }
      .button {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        margin-top: 2rem;
        padding: 0 1.5rem;
        border-radius: 12px;
        background: #8be36a;
        color: #0a1a08;
        font-weight: 650;
        text-decoration: none;
      }
      .button:hover { background: #a9f28a; }
      .button:focus-visible { outline: 2px solid #8be36a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img class="rick" src="/bilder/rick2.gif" width="248" height="313" alt="Rick schleicht davon">
      <h1>Dein Browser ist zu alt für diese Dimension</h1>
      <p>PortalHub braucht einen aktuellen Browser: Chrome ab 120, Firefox ab 121 oder Safari ab 17.2.</p>
      <p class="code">Fehlercode 406</p>
    </main>
  </body>
</html>
