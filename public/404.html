<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark">
    <title>Seite nicht gefunden - PortalHub</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <style>
      /* Standalone on purpose: these pages must work even when the app is down. */
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background: radial-gradient(60rem 36rem at 85% -12%, rgb(139 227 106 / 0.10), transparent 60%), #0a0e0c;
        color: #e9f0ea;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 34rem; text-align: center; }
      .portal {
        position: relative;
        width: 9rem;
        aspect-ratio: 1;
        margin: 0 auto 2.5rem;
        border-radius: 50%;
        filter: drop-shadow(0 0 2rem rgb(139 227 106 / 0.35));
      }
      .portal::before, .portal::after { content: ""; position: absolute; border-radius: 50%; }
      .portal::before {
        inset: 0;
        background: conic-gradient(from 0deg, #8be36a, #2e8a3f 16%, #a9f28a 32%, #1d5b2d 50%, #8be36a 66%, #2e8a3f 82%, #8be36a);
        -webkit-mask: radial-gradient(farthest-side, transparent 66%, #000 68%);
        mask: radial-gradient(farthest-side, transparent 66%, #000 68%);
        animation: spin 20s linear infinite;
      }
      .portal::after {
        inset: 22%;
        background: radial-gradient(circle, #030704 0%, #071a0c 60%, rgb(139 227 106 / 0.32) 100%);
        box-shadow: inset 0 0 1.5rem rgb(139 227 106 / 0.35);
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { margin: 0; font-size: clamp(2rem, 6vw, 2.75rem); line-height: 1.1; letter-spacing: -0.03em; }
      p { margin: 1rem 0 0; color: #9aaba0; font-size: 1.1rem; }
      .code { margin-top: 2rem; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.9rem; }
      .button {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        margin-top: 2rem;
        padding: 0 1.5rem;
        border-radius: 12px;
        background: #8be36a;
        color: #0a1a08;
        font-weight: 650;
        text-decoration: none;
      }
      .button:hover { background: #a9f28a; }
      .button:focus-visible { outline: 2px solid #8be36a; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { .portal::before { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="portal" aria-hidden="true"></div>
      <h1>Diese Dimension gibt es nicht</h1>
      <p>Die Seite, die du suchst, gibt es nicht, oder sie ist in eine andere Dimension gezogen. Prüfe die Adresse oder geh zurück zur Übersicht.</p>
      <a class="button" href="/">Zurück zur Übersicht</a>
      <p class="code">Fehlercode 404</p>
    </main>
  </body>
</html>
